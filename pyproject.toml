[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timeseries-sparklines"
version = "0.1.2"
description = "A lightweight Python utility that transforms raw data arrays directly into embeddable SVG sparkline strings via server-side rendering—optimized for AI agents, LLM tool-calling, and automated workflows."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Raj", email = "ai-musings99@gmail.com"}
]
keywords = ["timeseries", "svg", "plotting", "sparkline", "charts", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0,<3.0.0",
]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "black>=24.0.0,<25.0.0",
    "ruff>=0.1.0,<1.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/vrraj/timeseries-sparklines"
Repository = "https://github.com/vrraj/timeseries-sparklines"
Documentation = "https://github.com/vrraj/timeseries-sparklines#readme"

[project.scripts]
timeseries-server = "timeseries_svg.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"
