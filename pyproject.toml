[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timeseries-svg"
version = "0.1.0"
description = "General-purpose time series SVG plotting library for JSONB data"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["timeseries", "svg", "plotting", "sparkline", "charts", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.104.0,<0.105.0",
    "uvicorn>=0.24.0,<0.25.0",
    "pydantic>=2.0.0,<3.0.0",
]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "black>=24.0.0,<25.0.0",
    "ruff>=0.1.0,<1.0.0",
    "fastapi>=0.104.0,<0.105.0",
    "uvicorn>=0.24.0,<0.25.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/timeseries-svg"
Repository = "https://github.com/yourusername/timeseries-svg"
Documentation = "https://github.com/yourusername/timeseries-svg#readme"

[project.scripts]
timeseries-server = "timeseries_svg.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"
